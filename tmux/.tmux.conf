# .tmux.conf file

# Setting the prefix from C-b to C-a
set -g prefix C-a

# Free the original Ctrl-b prefix keybinding
unbind C-b

#setting the delay between prefix and command
set -sg escape-time 1

# Ensure that we can send Ctrl-A to other apps
bind C-a send-prefix

# Set the base index for windows to 1 instead of 0
set -g base-index 1

set-option -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
# Set the base index for panes to 1 instead of 0
set-window-option -g pane-base-index 1

# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# splitting panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable mouse scrolling and selection.
set -g mouse on

# Set the default terminal mode to 256color mode
set -g default-terminal "tmux-256color"

# set the status line's colors
set -g status-style "fg=#c0caf5,bg=#292e42"

# set the color of the window list
set-window-option -g window-status-style "fg=#7dcfff,bg=default"

# set colors for the active window
set-window-option -g window-status-current-style "fg=#1a1b26,bg=#f7768e,bold"

# pane colors
set -g pane-border-style "fg=#414868,bg=default"
set -g pane-active-border-style "fg=#7dcfff,bg=default"

# Command / message line
set -g message-style "fg=#c0caf5,bg=#292e42,bold"

# Status line left side
set -g status-left-length 40
set -g status-left "#[fg=#9ece6a]Session: #S #[fg=#e0af68]#I #[fg=#7dcfff]#P"

#set -g status-utf8 on # no longer necessary

# Status line right side
set -g status-right "#[fg=#7dcfff]%A, %d %b %Y %I:%M %p"
# Update the status bar every sixty seconds
set -g status-interval 60

# Center the window list
set -g status-justify centre

# Identify activity in other window
set-window-option -g monitor-activity on
set -g visual-activity on

# Keep window name fixed
set-option -g allow-rename off

# vi mode for buffer scroll
set-window-option -g mode-keys vi

# vi copy options
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Start the shell directly; no external wrapper is needed.
set -g default-command ""

# Integrate the tmux paste buffer with the macOS clipboard.
if-shell 'test "$(uname)" = Darwin' {
    bind C-c run-shell 'tmux save-buffer - | /usr/bin/pbcopy'
    bind C-v run-shell '/usr/bin/pbpaste | tmux load-buffer - \; paste-buffer'
}

# MAXIMIZE!!!
unbind Up
bind Up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp

# minimize
unbind Down
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# splits in pwd
unbind v
unbind n
bind v split-window -h -c "#{pane_current_path}"
bind n split-window -v -c "#{pane_current_path}"

# switch sessions fast!
bind -r ( switch-client -p
bind -r ) switch-client -n

# zsh is the bestsh
if-shell "test -x /bin/zsh" "set -g default-shell /bin/zsh"

# logging
bind P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# broadcast
unbind i
